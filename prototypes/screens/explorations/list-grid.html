<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vajeeva · RecipeList as a grid</title>
<!--
  Quick mock: recipe cards as a responsive grid inside the recessed-well header.
  2 cols (mobile) · 3 (md ≥768) · 4 (lg ≥1024). Vertical card = the Saved-screen
  grid card (.rcard) reused here. Tokens/illustrations are the app's real values.
-->
<style>
:root{
  --bone:#F2EDE1; --sand:#E9E1D0; --cream:#FBF8F1;
  --ink:#2A251E; --ink-2:#6E6656; --muted:#9C9482;
  --line:#E5DDCC; --line-2:#D8CEBA;
  --green:#3E6B4F; --green-soft:#E4EDE3;
  --amber:#C6902F; --amber-2:#A9701F; --amber-soft:#F4E8CE;
  --clay:#B4472E; --clay-soft:#F3E1D8;
  --shadow:0 4px 14px rgba(42,37,30,.08),0 1px 3px rgba(42,37,30,.05);
  --shadow-lift:0 10px 28px rgba(42,37,30,.13),0 2px 6px rgba(42,37,30,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#E7E0D1;font-family:var(--sans);color:var(--ink);
     -webkit-font-smoothing:antialiased;padding:34px 22px 70px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-family:var(--serif);font-size:24px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.lead{margin:0 0 28px;font-size:13px;line-height:1.55;color:var(--ink-2);max-width:640px}

.frame{margin:0 auto 34px}
.cap{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.cap .k{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
        color:var(--cream);background:var(--ink);border-radius:5px;padding:2px 8px}
.cap .n{font-family:var(--serif);font-size:15px;font-weight:700}
.cap .w{font-family:var(--mono);font-size:10px;color:var(--muted)}

/* the on-screen device: bone ground, header, then the recessed sand tray */
.device{background:var(--bone);border-radius:26px;overflow:hidden;border:1px solid rgba(42,37,30,.10);
        box-shadow:var(--shadow-lift)}
.dev-m{width:390px}.dev-md{width:768px}.dev-lg{width:1024px}

.inset{height:16px}
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.icobtn{width:34px;height:34px;border-radius:50%;background:var(--cream);border:1px solid var(--line);
        display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow);flex:none}
.icobtn svg{width:15px;height:15px}
.grow{flex:1;min-width:0}
.title{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:25px}
.sub{font-size:10px;color:var(--ink-2);line-height:14px}
.ln{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;gap:6px;overflow:hidden;padding:10px 16px 0}
.fchip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line-2);background:var(--cream);
       border-radius:999px;padding:6px 11px;font-size:10.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;flex:none}
.fchip svg{width:11px;height:11px}
.fchip.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.fchip.safe{border-color:var(--green);color:var(--green)}

/* recessed well */
.well{position:relative;margin-top:10px;background:var(--sand);border-top-left-radius:22px;border-top-right-radius:22px;
      padding:16px 14px 18px;min-height:220px}
.well::before{content:"";position:absolute;top:0;left:0;right:0;height:16px;pointer-events:none;
      background:linear-gradient(rgba(42,37,30,.16),rgba(42,37,30,0))}

/* ── the responsive grid ─────────────────────────────────────────────── */
.grid{display:grid;gap:10px}
.c2{grid-template-columns:repeat(2,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}

/* vertical grid card (Saved-screen .rcard pattern) */
.gcard{background:var(--cream);border:1px solid var(--line);border-radius:13px;padding:7px;box-shadow:var(--shadow);cursor:pointer}
.gcard:active{background:var(--sand)}
.gtile{position:relative;border-radius:9px;aspect-ratio:5/4;display:grid;place-items:center;overflow:hidden}
.gtile svg{width:58%;height:58%}
.gdots{position:absolute;top:6px;right:6px;display:flex;gap:2.5px}
.gdot{width:5px;height:5px;border-radius:50%;background:var(--clay);opacity:.7}
.gname{font-family:var(--serif);font-size:13px;font-weight:700;line-height:1.18;margin-top:7px}
.gta{font-family:var(--serif);font-style:italic;font-size:10px;color:var(--amber);margin-top:1px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta{font-size:9px;color:var(--muted);margin-top:4px}

.il-sand{fill:var(--sand)}.il-cream{fill:var(--cream)}.il-a{fill:var(--amber)}.il-a2{fill:var(--amber-2)}
.il-green{fill:var(--green)}.il-clay{fill:var(--clay)}.il-stroke{fill:none;stroke:var(--green);stroke-width:2.4;stroke-linecap:round}
.il-steam{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-linecap:round;opacity:.45}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path class="ln" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path class="ln" d="M4 6h16M7 12h10M10 18h4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path class="ln" d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path class="ln" d="M12 3l7 3v5c0 5-3 7.5-7 9-4-1.5-7-4-7-9V6z"/></symbol>
  <symbol id="ill-laddu" viewBox="0 0 64 64">
    <ellipse class="il-sand" cx="32" cy="49" rx="19" ry="4.5"/><circle class="il-a" cx="32" cy="33" r="15"/>
    <circle class="il-a2" cx="27" cy="30" r="1.5"/><circle class="il-a2" cx="35" cy="28" r="1.3"/><circle class="il-a2" cx="33" cy="37" r="1.6"/>
    <circle class="il-a2" cx="26" cy="38" r="1.2"/><circle class="il-a2" cx="38" cy="34" r="1.4"/><circle class="il-a2" cx="31" cy="33" r="1.2"/>
    <ellipse class="il-green" cx="32" cy="19.5" rx="3.6" ry="2.3"/></symbol>
  <symbol id="ill-cup" viewBox="0 0 64 64">
    <ellipse class="il-sand" cx="31" cy="51" rx="17" ry="4"/><path class="il-cream" d="M19 25h24l-2.6 20a4 4 0 0 1-4 3.5H25.6a4 4 0 0 1-4-3.5z"/>
    <path class="il-green" d="M20.4 25h21.2l-.7 5.4H21.1z"/><path class="il-stroke" d="M43.5 28a7 7 0 0 1 0 12"/>
    <path class="il-steam" d="M28 20c-2-2 2-4 0-6M36 20c-2-2 2-4 0-6"/></symbol>
  <symbol id="ill-bowl" viewBox="0 0 64 64">
    <ellipse class="il-sand" cx="32" cy="50" rx="18" ry="4"/><path class="il-cream" d="M15 33a17 13 0 0 0 34 0z"/>
    <ellipse class="il-a" cx="32" cy="33" rx="15" ry="4.6"/><circle class="il-clay" cx="28" cy="32" r="1.7"/>
    <circle class="il-clay" cx="36" cy="33" r="1.5"/><circle class="il-green" cx="32" cy="31.5" r="1.6"/>
    <path class="il-stroke" d="M40 22l-6 9" stroke-width="2.6"/><ellipse class="il-green" cx="41" cy="21" rx="3" ry="2" transform="rotate(35 41 21)"/></symbol>
</svg>

<div class="wrap">
  <h1>RecipeList — cards as a responsive grid</h1>
  <p class="lead">The list card becomes a vertical grid card (tile on top, like the Saved screen), inside the
     same recessed-well header. Columns step up with width: <b>2 → 3 → 4</b>.</p>
  <div id="frames"></div>
</div>

<script>
const CARDS = [
  {en:'Coconut Laddu', ta:'Narikela modaka', m:'Sweet · ~25 min',  ill:'laddu', tint:'var(--amber-soft)', dots:4},
  {en:'Wheat Balls',   ta:'Godhuma laddu',   m:'Sweet · ~30 min',  ill:'laddu', tint:'var(--amber-soft)', dots:3},
  {en:'Date Laddoo',   ta:'Kharjura laddu',  m:'No-cook · ~15 min', ill:'laddu', tint:'var(--green-soft)', dots:0},
  {en:'Ginger Barfi',  ta:'Ardraka paka',    m:'Sweet · ~45 min',  ill:'bowl',  tint:'var(--clay-soft)',  dots:0},
  {en:'Vada',          ta:'Vataka',          m:'Snack · ~8 min',   ill:'laddu', tint:'var(--amber-soft)', dots:0},
  {en:'Ragi Malt',     ta:'Ragi malt',       m:'Drink · ~10 min',  ill:'cup',   tint:'var(--green-soft)', dots:0},
  {en:'Rasam',         ta:'Rasam',           m:'Soup · ~20 min',   ill:'cup',   tint:'var(--green-soft)', dots:0},
  {en:'Ash Gourd Pudding', ta:'Poosanikai halwa', m:'Sweet · ~40 min', ill:'bowl', tint:'var(--clay-soft)', dots:4},
];
const card = c => `<div class="gcard">
  <div class="gtile" style="background:${c.tint}">
    <svg viewBox="0 0 64 64"><use href="#ill-${c.ill}"/></svg>
    ${c.dots?`<div class="gdots">${'<div class="gdot"></div>'.repeat(c.dots)}</div>`:''}
  </div>
  <div class="gname">${c.en}</div>
  <div class="gta">${c.ta}</div>
  <div class="gmeta">${c.m}</div></div>`;

const header = `
  <div class="inset"></div>
  <div class="hdr">
    <div class="icobtn"><svg><use href="#i-back"/></svg></div>
    <div class="grow"><div class="title">Solid</div><div class="sub">44 recipes · breads · sweets · snacks</div></div>
    <div class="icobtn"><svg><use href="#i-filter"/></svg></div>
  </div>
  <div class="chips">
    <span class="fchip on"><svg><use href="#i-check"/></svg> Sweets</span>
    <span class="fchip">Breads</span><span class="fchip">Snacks</span>
    <span class="fchip safe"><svg><use href="#i-shield"/></svg> Safe for me</span>
  </div>`;

const FRAMES = [
  {k:'Mobile', w:'< 768', dev:'dev-m',  cols:'c2', n:'2 columns'},
  {k:'md',     w:'≥ 768', dev:'dev-md', cols:'c3', n:'3 columns'},
  {k:'lg',     w:'≥ 1024',dev:'dev-lg', cols:'c4', n:'4 columns'},
];
document.getElementById('frames').innerHTML = FRAMES.map(f => `
  <div class="frame">
    <div class="cap"><span class="k">${f.k}</span><span class="n">${f.n}</span><span class="w">${f.w} px</span></div>
    <div class="device ${f.dev}">
      ${header}
      <div class="well"><div class="grid ${f.cols}">${CARDS.map(card).join('')}</div></div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
